<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Заказы</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="staff.css">
</head>
<body>

    <!-- Вход -->
    <section class="login" id="login">
        <h1>Вход для персонала</h1>
        <form id="login-form">
            <input type="email" id="email" placeholder="Почта" autocomplete="username" required>
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit">Войти</button>
        </form>
        <p class="msg" id="login-msg"></p>
    </section>

    <!-- Заказы -->
    <!-- Панель -->
    <section class="panel hidden" id="panel">
                <header class="panel-head">
            <h1>Кухня</h1>
            <div>
                <button class="accept" id="accept">Приём заказов</button>
                <span class="who" id="who"></span>
                <button class="logout" id="logout">Выйти</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-view="orders-view">Заказы</button>
            <button class="tab" data-view="stop-view">Стоп-лист</button>
        </nav>

        <!-- Заказы -->
        <div id="orders-view">
            <p class="msg" id="panel-msg"></p>
            <p class="empty hidden" id="empty">Заказов пока нет.</p>
            <div class="orders" id="orders"></div>
        </div>

        <!-- Стоп-лист -->
        <div id="stop-view" class="hidden">
            <p class="hint">Нажмите на блюдо, которое закончилось. Повторное нажатие вернёт его в меню.</p>
            <p class="msg" id="stop-msg"></p>
            <div id="stoplist"></div>
        </div>
    </section>

    <script type="module" src="staff.js"></script>
       <script type="module" src="staff-accept.js"></script>
</body>
</html>
